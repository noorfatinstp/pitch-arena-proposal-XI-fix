@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f2a30;--ink:#f2fff9;--card:#17383f}}
:root[data-theme="dark"]{--bg:#0f2a30;--ink:#f2fff9;--card:#17383f}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Trebuchet MS","Segoe UI",system-ui,sans-serif;min-height:100vh}
h1,h2{font-family:"Lilita One","Trebuchet MS",sans-serif;font-weight:400;letter-spacing:.3px;margin:.2em 0}
h1{font-size:34px}h2{font-size:26px}
#app{max-width:640px;margin:0 auto;padding:14px}
.bar{display:flex;align-items:center;gap:10px;margin-bottom:14px;font-weight:800}
.meter{flex:1;height:22px;border:3px solid var(--ink);border-radius:12px;background:var(--card);overflow:hidden}
#fill{height:100%;width:30%;background:linear-gradient(90deg,var(--coral),var(--sun),var(--teal));transition:width .4s}
.card{background:var(--card);border:3px solid var(--ink);border-radius:16px;box-shadow:6px 6px 0 var(--ink);padding:18px}
p{line-height:1.5}
.tag{display:inline-block;background:var(--sun);color:#14213d;border:2px solid var(--ink);border-radius:8px;padding:2px 10px;font-weight:800;font-size:13px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.g4{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.ch,.go{font:inherit;font-weight:800;color:#14213d;background:var(--sun);border:3px solid var(--ink);border-radius:12px;padding:10px;text-align:left;box-shadow:3px 3px 0 var(--ink);cursor:pointer}
.ch small{display:block;font-weight:500;font-size:12px;margin-top:2px;opacity:.85}
.ch:active,.go:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
.go{background:var(--coral);color:#fff;width:100%;text-align:center;font-size:18px;margin-top:14px;padding:14px}
.ch[disabled]{opacity:.4;box-shadow:none}
.cS{background:#7be0a8}.cW{background:#ffb199}.cO{background:#8fd3ff}.cT{background:#d9b3ff}
.placed{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.placed .ch{background:var(--teal);box-shadow:none;padding:4px 8px;font-size:12px;cursor:default}
.hint{animation:pulse .7s infinite alternate}
@keyframes pulse{to{transform:scale(1.04);background:#fff}}
.shake{animation:sh .35s}
@keyframes sh{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.bubble{display:flex;gap:12px;align-items:flex-start;margin-top:12px}
.av{font-size:44px;line-height:1}
.say{flex:1;border:3px solid var(--ink);border-radius:14px;padding:10px 12px;background:var(--bg);font-weight:700;line-height:1.45}
.opt{display:block;width:100%;margin-top:10px;font:inherit;text-align:left;background:var(--card);color:var(--ink);border:3px solid var(--ink);border-radius:12px;padding:12px;cursor:pointer;box-shadow:3px 3px 0 var(--ink)}
.good{color:#0e8a4f}.bad{color:var(--coral)}
input{font:inherit;width:100%;padding:12px;border:3px solid var(--ink);border-radius:12px;background:var(--bg);color:var(--ink);margin-top:10px}
.tb{height:16px;border:3px solid var(--ink);border-radius:8px;overflow:hidden;margin-top:16px;background:var(--bg)}.tb div{height:100%;background:var(--coral);animation-name:drain;animation-timing-function:linear;animation-fill-mode:forwards}@keyframes drain{from{width:100%}to{width:0}}
@media (prefers-reduced-motion:reduce){.hint,.shake{animation:none}}
#main{-webkit-user-select:none;user-select:none}input{-webkit-user-select:text;user-select:text}.rv{border-top:2px dashed var(--ink);padding:8px 0;font-size:14px}h3{margin:16px 0 4px}@media print{#app{display:none}}

function has(a,s){if(s.includes(' '))return a.includes(s);const t=s.length<5?0:s.length<8?1:2;return a.split(' ').some(w=>w==s||(s.length>3&&(w.includes(s)||lev(w,s)<=t)))}
const g3=(q,v)=>{const a=nz(v||'');return a&&a.split(' ').length<=14&&q[1].some(s=>has(a,s))&&!q[2].some(s=>has(a,s))?1:0};
const MP={s:'S',strength:'S',strengths:'S',kekuatan:'S',w:'W',weakness:'W',weaknesses:'W',kelemahan:'W',o:'O',opportunity:'O',opportunities:'O',peluang:'O',t:'T',threat:'T',threats:'T',ancaman:'T'};
function g2(v){const a=nz(v||'').split(' '),r=new Set();if(!a[0]||a.length>6)return '';a.forEach(w=>{if(MP[w])r.add(MP[w]);else if(w.length>4)for(const k in MP)if(k.length>4&&lev(w,k)<=1)r.add(MP[k])});return r.size==1?[...r][0]:''}
const BR=[['Susun proposalmu','Investor menerima 10 bagian proposal yang acak. Ketuk sesuai urutan yang benar dari halaman pertama sampai terakhir.'],['Analisis SWOT','Baca tiap pernyataan tentang usaha sabun cuci piring, lalu ketik S/W/O/T atau kata lengkapnya (Indonesia/Inggris). Tidak ada timer.'],['Proses membuat proposal','Jawab 10 soal isian singkat tentang alur membuat proposal. Jawaban dengan makna sama dianggap benar. Tidak ada timer.']];
function start(){clearInterval(LT);S=null;bar();M(`<span class="tag">Kelas XI · Proposal Usaha</span><h1>Pitch Arena</h1><p>Presentasi di depan investor lewat 3 ronde. Skor akhir 0-100.</p><input id="sn" maxlength="30" placeholder="Nama siswa" autocomplete="off"><input id="tn" maxlength="24" placeholder="Nama usaha kelompokmu" autocomplete="off"><button class="go" onclick="begin()">Masuk arena</button>`)}
function begin(){const n=$('sn').value.trim();if(!n)return fx($('sn'),'shake');S={nm:n,tm:$('tn').value.trim()||'Usaha Kami',r:1,ph:'intro',i:0,v:0,m1:0,warn:0};sv();intro(1)}
function intro(r){if(r==4){S.r=4;S.ph='end';sv();return end()}S.r=r;S.ph='intro';sv();M(`<span class="tag">Ronde ${r} dari 3</span><h2>${BR[r-1][0]}</h2><p>${BR[r-1][1]}</p><p><b>Tahap 1:</b> hafalkan ${CD[r-1].length} kartu. Tiap kartu muncul ${LEARN} detik lalu berganti sendiri. <b>Tahap 2:</b> jawab soal tanpa melihat kartu.</p><p class="bad"><b>Awas:</b> pindah tab/aplikasi saat menjawab membuat soal ronde ini diulang dari nomor 1 dan skor dikurangi 3 poin.</p><button class="go" onclick="learn(${r},0)">Mulai hafalan</button>`)}
function learn(r,i){S.r=r;S.ph='learn';S.i=i;sv();const L=CD[r-1];clearInterval(LT);if(i>=L.length)return M(`<span class="tag">Hafalan selesai</span><h2>Kartu disembunyikan</h2><p>Saatnya soal. Jawab dari ingatanmu.</p><button class="go" onclick="qs(${r})">Mulai soal</button>`);const c=L[i];let s=LEARN;M(`<span class="tag">Kartu hafalan ${i+1} dari ${L.length} · <span id="cd">${s}</span> detik</span><h2>${c[0]}</h2><p style="font-size:20px">${c[1]}</p><div class="tb"><div style="animation-duration:${LEARN}s"></div></div>`);LT=setInterval(()=>{s--;const e=$('cd');if(e)e.textContent=s;if(s<=0){clearInterval(LT);learn(r,i+1)}},1000)}
function qs(r){S.r=r;S.ph='q';const ix=n=>sh([...Array(n).keys()]);if(r==1&&!S.o1){S.o1=ix(10);S.n1=0}if(r==2&&!S.o2){S.o2=ix(SW.length);S.a2={}}if(r==3&&!S.o3){S.o3=ix(IN.length);S.a3={}}sv();[0,pg1,pg2,pg3][r]()}
function pg1(){const n=S.n1;M(`<span class="tag">Ronde 1 dari 3</span><h2>Cari bagian nomor ${n+1}</h2><div class="placed">${SEC.slice(0,n).map((s,i)=>`<span class="ch">${i+1}. ${s[0]}</span>`).join('')}</div><div class="grid">${S.o1.filter(i=>i>=n).map(i=>`<button class="ch" data-i="${i}" onclick="p1(${i},this)">${SEC[i][0]}<small>${SEC[i][1]}</small></button>`).join('')}</div>`)}
function p1(i,b){if(i==S.n1){S.n1++;sv();S.n1>=10?intro(2):pg1()}else{S.m1++;sv();fx(b,'shake');if(S.m1%3==0){const h=document.querySelector('[data-i="'+S.n1+'"]');if(h)h.classList.add('hint')}}}
function qp(r){const A=r==2?S.a2:S.a3,O=r==2?S.o2:S.o3,k=O.findIndex(x=>A[x]===undefined);if(k<0)return intro(r+1);const t=r==2?SW[O[k]][0]:IN[O[k]][0];M(`<span class="tag">Ronde ${r} · ${k+1} dari ${O.length}</span><div class="bubble"><div class="av">${r==2?'🧑‍💼':'🦈'}</div><div class="say">${Z(t)}</div></div><input id="ans" maxlength="${r==2?40:90}" placeholder="${r==2?'Ketik S / W / O / T atau kata lengkap':'Ketik jawaban singkat'}" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false"><button class="go" onclick="sub()">Jawab</button><p><small>${r==2?'Petunjuk: kekuatan dan kelemahan dari dalam usaha, peluang dan ancaman dari luar. ':''}Jawaban tidak langsung dinilai; hasilnya ada di akhir.</small></p>`);const e=$('ans');e.onkeydown=ev=>{if(ev.key=='Enter')sub()};e.onpaste=e.ondrop=ev=>ev.preventDefault();e.focus()}
const pg2=()=>qp(2),pg3=()=>qp(3);
function sub(){const v=$('ans').value.trim();if(!v)return fx($('ans'),'shake');const r=S.r,A=r==2?S.a2:S.a3,k=(r==2?S.o2:S.o3).find(x=>A[x]===undefined);A[k]=v;sv();qp(r)}
function warn(){clearInterval(LT);bar();M(`<div style="font-size:54px">⚠️</div><h2>Kamu meninggalkan halaman</h2><p>Soal Ronde ${S.r} diulang dari nomor 1 dan skor dikurangi 3 poin. Total pelanggaran: <b>${S.v}</b>.</p><button class="go" onclick="S.warn=0;sv();qs(S.r)">Ulangi dari nomor 1</button>`)}
function viol(){if(!S||S.ph!='q'||S.warn||away)return;away=1;S.v++;S.warn=1;if(S.r==1)S.n1=0;if(S.r==2)S.a2={};if(S.r==3)S.a3={};sv()}
function back(){away=0;if(S&&S.warn)warn()}
document.addEventListener('visibilitychange',()=>document.hidden?viol():back());
addEventListener('blur',viol);addEventListener('focus',back);
addEventListener('contextmenu',e=>e.preventDefault());
['copy','cut'].forEach(t=>addEventListener(t,e=>{if(!S||S.ph!='end')e.preventDefault()}));
function gr(){const s1=Math.max(0,20-S.m1);let c2=0,c3=0;const r2=S.o2.map(x=>{const a=S.a2[x]||'-',ok=g2(a)==SW[x][1]?1:0;c2+=ok;return[SW[x][0],a,SW[x][1],ok]});const r3=S.o3.map(x=>{const q=IN[x],a=S.a3[x]||'-',ok=g3(q,a);c3+=ok;return[q[0],a,q[3],q[4],ok]});const s2=+(c2*1.6).toFixed(1),s3=c3*4,pen=S.v*3;return{s1,s2,s3,c2,c3,pen,tot:Math.max(0,Math.round(s1+s2+s3-pen)),r2,r3}}
function end(){clearInterval(LT);bar();const g=gr(),t=g.tot,v=t>=85?['🏆','Luar biasa!']:t>=60?['🤝','Cukup baik, ulangi beberapa materi.']:['📝','Perlu belajar lagi.'];
const R2=g.r2.map((x,i)=>`<div class="rv ${x[3]?'good':'bad'}">${x[3]?'✓':'✗'} ${i+1}. ${esc(x[0])}<br><small>Jawabanmu: <b>${esc(x[1])}</b> · Kunci: <b>${NM[x[2]]}</b></small></div>`).join('');
const R3=g.r3.map((x,i)=>`<div class="rv ${x[4]?'good':'bad'}">${x[4]?'✓':'✗'} ${i+1}. ${esc(x[0])}<br><small>Jawabanmu: <b>${esc(x[1])}</b><br>Jawaban benar: <b>${esc(x[2])}</b><br>${esc(x[3])}</small></div>`).join('');
M(`<div style="font-size:54px">${v[0]}</div><h2>${esc(S.nm)} · ${t}/100</h2><p>${v[1]} Usaha: ${esc(S.tm)}</p><p>Ronde 1: <b>${g.s1}</b>/20 (salah ketuk: ${S.m1})<br>Ronde 2: <b>${g.s2}</b>/40 (${g.c2}/25 benar)<br>Ronde 3: <b>${g.s3}</b>/40 (${g.c3}/10 benar)<br>Pengurangan pindah tab: <b>−${g.pen}</b> (${S.v} pelanggaran)<br><b>Nilai akhir: ${t}/100</b></p><button class="go" onclick="cp()">Salin laporan untuk guru</button><h3>Review Ronde 2: SWOT</h3>${R2}<h3>Review Ronde 3: Proses Proposal</h3>${R3}<p><small>Jawaban benar tapi diksinya jauh berbeda bisa saja terbaca salah oleh sistem. Tunjukkan laporan ini ke guru untuk penilaian ulang.</small></p>`)}
function cp(){const g=gr();const x=[`${S.nm} (${S.tm}) Nilai ${g.tot}/100 | R1 ${g.s1}/20 | R2 ${g.s2}/40 | R3 ${g.s3}/40 | Pelanggaran ${S.v} (-${g.pen})`,...g.r2.map((a,i)=>`R2-${i+1}: ${a[1]} (kunci ${a[2]}) ${a[3]?'benar':'salah'}`),...g.r3.map((a,i)=>`R3-${i+1}: ${a[1]} (kunci ${a[2]}) ${a[4]?'benar':'salah'}`)].join('\n');try{navigator.clipboard.writeText(x)}catch(e){}}
if(location.hash=='#reset-guru-7x')try{localStorage.removeItem(KEY)}catch(e){}
try{S=JSON.parse(localStorage.getItem(KEY))}catch(e){S=null}
function resume(){bar();if(S.warn)return warn();if(S.r==4||S.ph=='end')return end();if(S.ph=='learn')return learn(S.r,S.i);if(S.ph=='q')return qs(S.r);intro(S.r)}
S&&S.nm?resume():start();

</script></body></html>
